{% extends "base.html" %}

{% block title %}
Login - Dayflow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Welcome Back</h1>

    <p>
        Sign in to your Dayflow account.
    </p>


    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit" class="btn">

            Sign In

        </button>

    </form>


    <p>

        Don't have an account?

        <a href="/register">

            Create one

        </a>

    </p>

</div>

{% endblock %}
