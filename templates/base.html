<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Dayflow{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <a href="/" class="logo">
            Dayflow
        </a>

        <div class="nav-links">

            {% if session.get("user_id") %}

                <a href="/logout">
                    Logout
                </a>

            {% else %}

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Sign Up
                </a>

            {% endif %}

        </div>

    </nav>


    <main>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert {{ category }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
