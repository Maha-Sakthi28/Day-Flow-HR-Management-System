{% extends "base.html" %}
{% block title %}Admin Registration{% endblock %}
{% block auth_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark">D</span>
            <h1>Dayflow HR</h1>
        </div>
        <p class="auth-subtitle">Create an Administrator Account</p>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <label for="login_id">Login ID</label>
            <input type="text" id="login_id" name="login_id" placeholder="Choose a unique Login ID" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="6">

            <button type="submit" class="btn btn-primary btn-block">Create Admin Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
