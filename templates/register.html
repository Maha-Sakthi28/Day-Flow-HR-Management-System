{% extends "base.html" %}

{% block title %}
Sign Up - Dayflow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Create Account</h1>

    <form method="POST">

        <label>Full Name</label>

        <input
            type="text"
            name="login_id"
            placeholder="Login ID"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            placeholder="Password"
            name="password"
            required
        >


        <label>Role</label>

        <select name="role" required>

            <option value="employee">
                Employee
            </option>

            <option value="admin">
                Admin / HR
            </option>

        </select>


        <button type="submit" class="btn">

            Create Account

        </button>

    </form>


    <p>

        Already have an account?

        <a href="/login">

            Login

        </a>

    </p>

</div>

{% endblock %}
